apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.service.entrypoint }}
  routes:
  - match: Host(`{{ .Values.host }}`)
    kind: Rule
    services:
    - name: {{ include "chart.fullname" . }}
      port: {{ .Values.service.port }}
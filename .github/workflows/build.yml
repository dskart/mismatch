name: 🔨 build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: jdx/mise-action@v4
      with:
        install_args: rust
    - uses: ./.github/actions/cargo-cache
    - name: Run build
      run: cargo build --verbose

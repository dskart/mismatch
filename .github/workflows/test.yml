name: 🧪 Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: jdx/mise-action@v4
      with:
        install_args: rust
    - uses: ./.github/actions/cargo-cache
    - name: Run tests
      run: | 
        make models
        make gen_word_dict
        cargo test --verbose


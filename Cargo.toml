[package]
name = "mismatch"
version = "0.7.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.7.9", features = ["json"] }
clap = "4.5.23"
http-body-util = "0.1.2"
listenfd = "1.0.1"
mime = "0.3.17"
minijinja = "2.5.0"
ndarray = "0.16.1"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
serde_yaml = "0.9.34"
tokenizers = "0.21.0"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
ort = "=2.0.0-rc.9"
rand = "0.8.5"
base64 = "0.22.1"


[features]
load-dynamic = []
cuda = []
